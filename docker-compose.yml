# Banco de dados para desenvolvimento local: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: divida
      POSTGRES_PASSWORD: divida
      POSTGRES_DB: controle_divida
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  pgdata:
